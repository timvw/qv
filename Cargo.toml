[package]
name = "qv"
description = "quickly view your data"
version = "0.11.0"
edition = "2021"
homepage = "https://github.com/timvw/qv"
repository = "https://github.com/timvw/qv"
readme = "README.md"
authors = ["Tim Van Wassenhove <tim@timvw.be>"]
license = "Apache-2.0"
keywords = [ "quickview", "data", "query", "sql", "datafusion" ]
exclude = [
    ".github/*",
    "ci/*",
    "dev/*",
    "testing/*",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aws-config = "1.12.0"
# Without default features: the default "rustls" feature pulls the legacy hyper 0.14 / rustls 0.21 client.
aws-sdk-glue = { version = "1.164.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-types = "1.6.0"
aws-credential-types = "1.3.0"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
datafusion = { version = "55.3.0", features = ["avro"] }
deltalake = { version = "1.1.2", default-features = false, features = ["datafusion-ext", "s3", "gcs"] }
futures = "0.3.34"
# Temporarily pinned to git: no iceberg release supports DataFusion 55 yet; the DataFusion
# integration moved to apache/datafusion-iceberg, which pins iceberg-rust at this same rev.
# Switch back to crates.io releases once both are published.
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3" }
iceberg-catalog-glue = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3" }
iceberg-datafusion = { git = "https://github.com/apache/datafusion-iceberg", rev = "a7e5f555970bf5ee61c6f47d3815d503ff837b2a" }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3", default-features = false, features = ["opendal-fs", "opendal-s3", "opendal-gcs"] }
object_store = { version = "0.13.2", features = ["aws", "gcp"] }
openssl = { version = "0.10.81", optional = true }
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "parking_lot"] }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[features]
default = []
# Enable OpenSSL when needed; use vendored builds for fully static artifacts.
openssl-tls = ["dep:openssl"]
vendored-openssl = ["openssl-tls", "openssl/vendored"]
