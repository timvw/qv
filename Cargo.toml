[package]
name = "qv"
description = "quickly view your data"
version = "0.9.15"
edition = "2021"
homepage = "https://github.com/timvw/qv"
repository = "https://github.com/timvw/qv"
readme = "README.md"
authors = ["Tim Van Wassenhove <tim@timvw.be>"]
license = "Apache-2.0"
keywords = [ "quickview", "data", "query", "sql", "datafusion" ]
exclude = [
    ".github/*",
    "ci/*",
    "dev/*",
    "testing/*",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aws-config = "1.12.0"
aws-sdk-glue = "1.164.0"
aws-types = "1.6.0"
aws-credential-types = "1.3.0"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
datafusion = { version = "53.1.0", features = ["avro"] }
deltalake = { version = "0.32.4", default-features = false, features = ["datafusion-ext", "s3", "gcs"] }
futures = "0.3.34"
iceberg = "0.10.1"
iceberg-catalog-glue = "0.10.1"
iceberg-catalog-rest = "0.10.1"
iceberg-datafusion = "0.10.1"
iceberg-storage-opendal = { version = "0.10.1", default-features = false, features = ["opendal-fs", "opendal-s3", "opendal-gcs"] }
object_store = { version = "0.13.2", features = ["aws", "gcp"] }
openssl = { version = "0.10.81", optional = true }
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "parking_lot"] }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[features]
default = []
# Enable OpenSSL when needed; use vendored builds for fully static artifacts.
openssl-tls = ["dep:openssl"]
vendored-openssl = ["openssl-tls", "openssl/vendored"]
